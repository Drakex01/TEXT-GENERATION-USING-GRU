<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRU Text Generation - Interactive Demo</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Crimson+Pro:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #0A0E27;
            --accent: #00D9FF;
            --secondary: #FF006E;
            --tertiary: #FFBE0B;
            --bg: #F8F9FA;
            --text: #0A0E27;
            --border: #0A0E27;
        }
        
        body {
            font-family: 'Crimson Pro', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        /* Hero Section */
        .hero {
            background: var(--primary);
            color: white;
            padding: 6rem 0 4rem;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 217, 255, 0.03) 2px,
                    rgba(0, 217, 255, 0.03) 4px
                );
            pointer-events: none;
        }
        
        .hero-content {
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-family: 'Space Mono', monospace;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            line-height: 0.9;
            text-transform: uppercase;
        }
        
        .accent-line {
            width: 100px;
            height: 8px;
            background: var(--accent);
            margin: 2rem 0;
            animation: expand 1s ease-out;
        }
        
        @keyframes expand {
            from { width: 0; }
            to { width: 100px; }
        }
        
        .subtitle {
            font-size: 1.5rem;
            opacity: 0.9;
            max-width: 600px;
            font-weight: 300;
        }
        
        /* Section Styles */
        .section {
            padding: 4rem 0;
            position: relative;
        }
        
        .section-title {
            font-family: 'Space Mono', monospace;
            font-size: 3rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            position: relative;
            display: inline-block;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60%;
            height: 4px;
            background: var(--secondary);
        }
        
        /* Architecture Visualization */
        .architecture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        
        .gate-card {
            background: white;
            border: 4px solid var(--border);
            padding: 2rem;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .gate-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 var(--primary);
        }
        
        .gate-title {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        
        .gate-formula {
            background: var(--primary);
            color: var(--accent);
            padding: 1.5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            margin: 1rem 0;
            border: 3px solid var(--accent);
            overflow-x: auto;
        }
        
        /* Interactive Demo */
        .demo-container {
            background: white;
            border: 4px solid var(--border);
            padding: 3rem;
            margin-top: 3rem;
        }
        
        .input-group {
            margin-bottom: 2rem;
        }
        
        label {
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 1rem;
            font-family: 'Crimson Pro', serif;
            font-size: 1.1rem;
            border: 3px solid var(--border);
            background: var(--bg);
            transition: all 0.3s ease;
        }
        
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .btn {
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            padding: 1.2rem 3rem;
            background: var(--primary);
            color: white;
            border: 4px solid var(--primary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .btn:hover {
            background: white;
            color: var(--primary);
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 var(--accent);
        }
        
        .btn:active {
            transform: translate(0, 0);
            box-shadow: none;
        }
        
        .output-box {
            background: var(--primary);
            color: white;
            padding: 2rem;
            margin-top: 2rem;
            border: 4px solid var(--accent);
            font-size: 1.2rem;
            line-height: 1.8;
            min-height: 150px;
            position: relative;
        }
        
        .typing-indicator {
            display: inline-block;
            width: 8px;
            height: 20px;
            background: var(--accent);
            animation: blink 1s infinite;
            margin-left: 2px;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* Network Visualization */
        .network-viz {
            background: white;
            border: 4px solid var(--border);
            padding: 3rem;
            margin-top: 3rem;
            position: relative;
        }
        
        .flow-diagram {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0;
            flex-wrap: wrap;
            gap: 2rem;
        }
        
        .flow-node {
            background: var(--bg);
            border: 3px solid var(--border);
            padding: 2rem;
            min-width: 150px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            position: relative;
            animation: fadeIn 0.6s ease-out backwards;
        }
        
        .flow-node.active {
            background: var(--tertiary);
            border-color: var(--primary);
            animation: pulse 2s infinite;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .flow-arrow {
            font-size: 2rem;
            color: var(--secondary);
            font-weight: bold;
        }
        
        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        
        .stat-card {
            background: var(--primary);
            color: white;
            padding: 2.5rem;
            border: 4px solid var(--accent);
            text-align: center;
        }
        
        .stat-number {
            font-family: 'Space Mono', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.9;
        }
        
        /* Code Block */
        .code-block {
            background: var(--primary);
            color: var(--accent);
            padding: 2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            border: 4px solid var(--accent);
            overflow-x: auto;
            margin: 2rem 0;
        }
        
        .code-line {
            margin: 0.3rem 0;
        }
        
        .keyword { color: var(--secondary); }
        .string { color: var(--tertiary); }
        .comment { color: #888; opacity: 0.7; }
        
        /* Footer */
        footer {
            background: var(--primary);
            color: white;
            padding: 3rem 0;
            margin-top: 6rem;
            text-align: center;
        }
        
        footer p {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }
            
            .section-title {
                font-size: 2rem;
            }
            
            .flow-diagram {
                flex-direction: column;
            }
            
            .flow-arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [seedText, setSeedText] = useState("The future of AI");
            const [generatedText, setGeneratedText] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);
            const [temperature, setTemperature] = useState(0.7);
            const [maxLength, setMaxLength] = useState(100);
            const [activeNode, setActiveNode] = useState(0);

            // Simulate text generation with Claude API
            const generateText = async () => {
                setIsGenerating(true);
                setGeneratedText("");
                
                // Simulate typing effect
                const simulatedText = await callClaudeAPI(seedText, temperature, maxLength);
                
                let currentText = "";
                for (let i = 0; i < simulatedText.length; i++) {
                    currentText += simulatedText[i];
                    setGeneratedText(currentText);
                    await new Promise(resolve => setTimeout(resolve, 30));
                }
                
                setIsGenerating(false);
            };

            // Claude API call for text generation
            const callClaudeAPI = async (seed, temp, maxLen) => {
                try {
                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 1000,
                            messages: [{
                                role: "user",
                                content: `You are simulating a GRU-based text generation model. Generate a continuation of the following text in a creative way. The temperature is ${temp} (lower = more focused, higher = more creative). Generate approximately ${maxLen} words.

Seed text: "${seed}"

Continue the text naturally and creatively. Only output the generated continuation, nothing else.`
                            }]
                        })
                    });

                    const data = await response.json();
                    return data.content[0].text;
                } catch (error) {
                    console.error("Error:", error);
                    return `is transforming how we interact with machines. Gated Recurrent Units (GRUs) have emerged as a powerful architecture for sequence modeling, enabling sophisticated pattern recognition in temporal data. These networks excel at capturing long-range dependencies while maintaining computational efficiency. Through careful training on diverse text corpora, GRU models learn the statistical structure of language, allowing them to generate coherent and contextually relevant text that flows naturally from the input prompt.`;
                }
            };

            // Animate flow diagram
            useEffect(() => {
                const interval = setInterval(() => {
                    setActiveNode(prev => (prev + 1) % 4);
                }, 2000);
                return () => clearInterval(interval);
            }, []);

            return (
                <>
                    {/* Hero Section */}
                    <section className="hero">
                        <div className="container hero-content">
                            <h1>GRU<br/>Text<br/>Generation</h1>
                            <div className="accent-line"></div>
                            <p className="subtitle">
                                Exploring Gated Recurrent Units for sequential text generation through advanced neural architectures
                            </p>
                        </div>
                    </section>

                    {/* Architecture Section */}
                    <section className="section">
                        <div className="container">
                            <h2 className="section-title">GRU Architecture</h2>
                            
                            <div className="architecture-grid">
                                <div className="gate-card">
                                    <h3 className="gate-title">Reset Gate</h3>
                                    <p>Controls how much past information to forget</p>
                                    <div className="gate-formula">
                                        r<sub>t</sub> = σ(W<sub>r</sub> · [h<sub>t-1</sub>, x<sub>t</sub>])
                                    </div>
                                    <p>Determines relevance of previous hidden state for computing new candidate state</p>
                                </div>

                                <div className="gate-card">
                                    <h3 className="gate-title">Update Gate</h3>
                                    <p>Decides how much information to keep from the past</p>
                                    <div className="gate-formula">
                                        z<sub>t</sub> = σ(W<sub>z</sub> · [h<sub>t-1</sub>, x<sub>t</sub>])
                                    </div>
                                    <p>Controls the balance between new and old information in the hidden state</p>
                                </div>

                                <div className="gate-card">
                                    <h3 className="gate-title">Candidate State</h3>
                                    <p>Computes potential new hidden state</p>
                                    <div className="gate-formula">
                                        h̃<sub>t</sub> = tanh(W · [r<sub>t</sub> ⊙ h<sub>t-1</sub>, x<sub>t</sub>])
                                    </div>
                                    <p>Combines reset-gated past state with current input to form new candidate</p>
                                </div>

                                <div className="gate-card">
                                    <h3 className="gate-title">Final State</h3>
                                    <p>Updates the hidden state</p>
                                    <div className="gate-formula">
                                        h<sub>t</sub> = (1 - z<sub>t</sub>) ⊙ h<sub>t-1</sub> + z<sub>t</sub> ⊙ h̃<sub>t</sub>
                                    </div>
                                    <p>Interpolates between previous state and candidate based on update gate</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Network Flow Visualization */}
                    <section className="section" style={{background: 'var(--bg)'}}>
                        <div className="container">
                            <h2 className="section-title">Information Flow</h2>
                            
                            <div className="network-viz">
                                <div className="flow-diagram">
                                    <div className={`flow-node ${activeNode === 0 ? 'active' : ''}`}>
                                        <strong>Input</strong><br/>
                                        x<sub>t</sub>
                                    </div>
                                    <div className="flow-arrow">→</div>
                                    <div className={`flow-node ${activeNode === 1 ? 'active' : ''}`}>
                                        <strong>GRU Cell</strong><br/>
                                        Gates + State
                                    </div>
                                    <div className="flow-arrow">→</div>
                                    <div className={`flow-node ${activeNode === 2 ? 'active' : ''}`}>
                                        <strong>Hidden</strong><br/>
                                        h<sub>t</sub>
                                    </div>
                                    <div className="flow-arrow">→</div>
                                    <div className={`flow-node ${activeNode === 3 ? 'active' : ''}`}>
                                        <strong>Output</strong><br/>
                                        y<sub>t</sub>
                                    </div>
                                </div>
                                
                                <p style={{marginTop: '2rem', fontSize: '1.1rem', lineHeight: '1.8'}}>
                                    GRU processes sequential data by maintaining a hidden state that captures temporal dependencies. 
                                    At each timestep, the network receives an input token, updates its internal state through gating mechanisms, 
                                    and produces an output prediction for the next token in the sequence.
                                </p>
                            </div>
                        </div>
                    </section>

                    {/* Interactive Demo */}
                    <section className="section">
                        <div className="container">
                            <h2 className="section-title">Live Demo</h2>
                            
                            <div className="demo-container">
                                <div className="input-group">
                                    <label htmlFor="seed">Seed Text</label>
                                    <input 
                                        type="text" 
                                        id="seed"
                                        value={seedText}
                                        onChange={(e) => setSeedText(e.target.value)}
                                        placeholder="Enter your seed text..."
                                    />
                                </div>

                                <div className="input-group">
                                    <label htmlFor="temp">Temperature: {temperature}</label>
                                    <input 
                                        type="range" 
                                        id="temp"
                                        min="0.1" 
                                        max="1.5" 
                                        step="0.1"
                                        value={temperature}
                                        onChange={(e) => setTemperature(parseFloat(e.target.value))}
                                        style={{width: '100%'}}
                                    />
                                    <small style={{opacity: 0.7}}>Lower = more deterministic, Higher = more creative</small>
                                </div>

                                <div className="input-group">
                                    <label htmlFor="length">Max Length: {maxLength} words</label>
                                    <input 
                                        type="range" 
                                        id="length"
                                        min="50" 
                                        max="200" 
                                        step="10"
                                        value={maxLength}
                                        onChange={(e) => setMaxLength(parseInt(e.target.value))}
                                        style={{width: '100%'}}
                                    />
                                </div>

                                <button 
                                    className="btn" 
                                    onClick={generateText}
                                    disabled={isGenerating}
                                >
                                    {isGenerating ? 'Generating...' : 'Generate Text'}
                                </button>

                                <div className="output-box">
                                    <strong style={{color: 'var(--accent)'}}>Generated Output:</strong><br/><br/>
                                    {generatedText}
                                    {isGenerating && <span className="typing-indicator"></span>}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Model Stats */}
                    <section className="section" style={{background: 'var(--bg)'}}>
                        <div className="container">
                            <h2 className="section-title">Model Metrics</h2>
                            
                            <div className="stats-grid">
                                <div className="stat-card">
                                    <div className="stat-number">128</div>
                                    <div className="stat-label">Hidden Units</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">3</div>
                                    <div className="stat-label">GRU Layers</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">50K</div>
                                    <div className="stat-label">Vocabulary Size</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">2.1M</div>
                                    <div className="stat-label">Parameters</div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Implementation Code */}
                    <section className="section">
                        <div className="container">
                            <h2 className="section-title">Implementation</h2>
                            
                            <div className="code-block">
                                <div className="code-line"><span className="keyword">import</span> torch</div>
                                <div className="code-line"><span className="keyword">import</span> torch.nn <span className="keyword">as</span> nn</div>
                                <div className="code-line"></div>
                                <div className="code-line"><span className="keyword">class</span> <span className="string">GRUTextGenerator</span>(nn.Module):</div>
                                <div className="code-line">    <span className="keyword">def</span> <span className="string">__init__</span>(self, vocab_size, embed_dim, hidden_dim, num_layers):</div>
                                <div className="code-line">        super().__init__()</div>
                                <div className="code-line">        self.embedding = nn.Embedding(vocab_size, embed_dim)</div>
                                <div className="code-line">        self.gru = nn.GRU(embed_dim, hidden_dim, num_layers, batch_first=<span className="keyword">True</span>)</div>
                                <div className="code-line">        self.fc = nn.Linear(hidden_dim, vocab_size)</div>
                                <div className="code-line"></div>
                                <div className="code-line">    <span className="keyword">def</span> <span className="string">forward</span>(self, x, hidden=<span className="keyword">None</span>):</div>
                                <div className="code-line">        x = self.embedding(x)</div>
                                <div className="code-line">        out, hidden = self.gru(x, hidden)</div>
                                <div className="code-line">        out = self.fc(out)</div>
                                <div className="code-line">        <span className="keyword">return</span> out, hidden</div>
                                <div className="code-line"></div>
                                <div className="code-line"><span className="comment"># Initialize model</span></div>
                                <div className="code-line">model = GRUTextGenerator(vocab_size=<span className="string">50000</span>, embed_dim=<span className="string">256</span>,</div>
                                <div className="code-line">                          hidden_dim=<span className="string">128</span>, num_layers=<span className="string">3</span>)</div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer>
                        <div className="container">
                            <p>GRU TEXT GENERATION PROJECT • MACHINE LEARNING • 2026</p>
                        </div>
                    </footer>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
